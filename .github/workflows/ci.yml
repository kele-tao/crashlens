name: ci
"on": [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python examples/init_demo_repo.py
      - run: pytest -q
      - run: python -m crashlens --help
      - run: python -m crashlens cluster examples --repo examples/demo_repo --top 3
      - run: python -m crashlens annotate examples/python_error.log --repo examples/demo_repo
